/* Layout: one-column phone app, chalkboard-green identity, chalk-yellow stars */

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --board:#1E3A31; --board-ink:#EEF3EC; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tag{display:inline-block;font-size:16px;border:1px dashed var(--muted);color:var(--muted);padding:1px 8px;border-radius:4px}

.btn.chalk{background:var(--chalk);color:#1B2924}

.btn.small{padding:6px 12px;font-size:16px}

h2.sec{font-size:19px;margin:16px 0 8px}

.steps{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}

.step.on{border-color:var(--accent)}
.step svg{width:100%;height:76px;stroke:var(--ink);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.step svg .new{stroke:var(--accent)}
.score{text-align:center;font-weight:700;font-size:20px;margin:6px 0}
.dom{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{height:78px;border-radius:10px;border:1.5px solid var(--line);background:var(--board);color:var(--board-ink);cursor:pointer;padding:4px}
.mc>span{visibility:hidden}.mc::before{content:"؟";font:700 27px var(--ui);color:var(--chalk)}
.mc.on,.mc.ok{background:var(--surface);color:var(--ink)}.mc.on::before,.mc.ok::before{content:none}.mc.on>span,.mc.ok>span{visibility:visible}.mc.ok{border-color:var(--ok);background:var(--ok-soft)}
.words{display:flex;flex-wrap:wrap;gap:8px;font-family:var(--ar)}
.wd{font:21px/1.6 var(--ar);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center}

.wd.sel{border-color:var(--chalk);background:var(--accent-soft)}.wd.ok{border-color:var(--ok);background:var(--ok-soft)}.wd.miss{border-color:var(--chalk);background:var(--accent-soft)}.wd.no{border-color:var(--bad);background:var(--bad-soft)}
.sch{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:400px;margin:0 auto}
.sc{aspect-ratio:1;max-width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:700 23px var(--ui);cursor:pointer}
.sc.ok{background:var(--accent-soft);color:var(--muted)}.sc.no{background:var(--bad-soft)}
.breath{display:grid;place-items:center;height:280px;position:relative}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--accent-soft),var(--accent));transition:transform 4s ease-in-out}
.bt{position:absolute;font:700 20px var(--ui);color:var(--ink);background:var(--surface);padding:4px 12px;border-radius:8px;bottom:6px}
.minute{border:2px dashed var(--chalk);border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}

.pr{gap:6px;padding:6px 8px}.num{min-width:22px;text-align:center;color:var(--muted)}.pr .inp{margin:0;padding:6px 8px}.nm2{font:18px var(--ar)}
.mini{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:4px 8px;font:600 16px var(--ui);cursor:pointer;white-space:nowrap}.mini[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}.mini.del{color:var(--bad)}
.lv{display:flex;gap:3px}.sel{padding:5px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:16px var(--ui)}
.pr{flex-wrap:wrap}.pr .t{min-width:0;flex:1 1 170px}.inp.mkin{width:84px;flex:none;text-align:center;font:700 20px var(--ui)}
.tblw{overflow-x:auto}.mt{width:100%;border-collapse:collapse;font-size:18px;background:var(--surface)}.mt th{background:var(--accent-soft);padding:6px;font-size:16px}.mt td{border-top:1px solid var(--line);padding:6px;text-align:center;font-variant-numeric:tabular-nums}.mt td:nth-child(2){text-align:start;font-family:var(--ar)}
.bkwarn{width:100%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;background:var(--bad-soft);border:2px solid var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--ink)}.bkwarn b{color:var(--bad);font-size:18px}.bkwarn span{font-size:16px}
.mapc{width:100%;border:1px solid var(--line);border-radius:10px;display:block}
.rahat{width:100%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;background:var(--accent-soft);border:0;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;font:inherit;color:var(--ink)}.rahat b{font-size:19px}.rahat span{font-size:16px;color:var(--muted)}
.hub svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:2;margin-bottom:4px}.hub b{font-size:18px}.hub span{font-size:16px;color:var(--muted)}
.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px}.lnk{background:none;border:0;color:var(--accent);font:600 17px var(--ui);text-decoration:underline;cursor:pointer}
.tiles.t2{grid-template-columns:repeat(2,1fr)}
.cboard{background:var(--board);color:var(--board-ink);border:8px solid #8a6a43;border-radius:8px;padding:10px 12px;font-family:var(--ar)}
.cb-top{display:flex;justify-content:space-between;font-size:16px;opacity:.85}

.cb-st2{color:var(--chalk)}.lv3 p{margin:0 0 6px}
.seg{display:inline;opacity:1}.seg-p{font-size:22px;line-height:2;margin:8px 0 14px}

function pad(canvas,onEnd){
 const ctx=canvas.getContext('2d');let strokes=[],cur=null;
 const fit=()=>{const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);redraw()};
 const ink=()=>getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1B2924';
 function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=ink();ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(s.length==1)ctx.lineTo(s[0][0]+.1,s[0][1]);ctx.stroke()}}
 const pos=e=>{const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
 canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);cur=[pos(e)];strokes.push(cur);redraw()};
 canvas.onpointermove=e=>{if(!cur)return;cur.push(pos(e));redraw()};
 canvas.onpointerup=canvas.onpointercancel=()=>{if(cur){cur=null;onEnd&&onEnd()}};
 requestAnimationFrame(fit);
 return{clear(){strokes=[];redraw()},undo(){strokes.pop();redraw()},strokes:()=>strokes,size:()=>canvas.getBoundingClientRect()};
}

 }

function parseLoc(t){let m=t.match(/[?&](?:q|query|ll)=(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/)||t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/)||t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);return m?{lat:+m[1],lng:+m[2]}:null}
const digits=s=>(s||'').replace(/\D/g,'').slice(-8);
function parseChat(txt){const lines=txt.split(/\r?\n/),re=/^‎?\[?(\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}),?\s+(\d{1,2}:\d{2}(?::\d{2})?)(?:\s?[APap]\.?[Mm]\.?)?\]?\s*[-–]?\s*([^:]{1,60}):\s?(.*)$/;
 const msgs=[];for(const l of lines){const m=l.match(re);if(m)msgs.push({who:m[3].replace(/[‎‪‬]/g,'').trim(),txt:m[4]});else if(msgs.length)msgs[msgs.length-1].txt+=' '+l}
 const P=pupils(),out=[];
 msgs.forEach((m,i)=>{const loc=parseLoc(m.txt);if(!loc)return;
  let idx=-1;const d=digits(m.who);if(d.length==8)idx=P.findIndex(p=>digits(p.tel)==d);
  if(idx<0){const near=msgs.slice(Math.max(0,i-2),i+4).filter(x=>x.who==m.who).map(x=>x.txt).join(' ');idx=P.findIndex(p=>{const f=p.name.split(/[\s\/]+/)[0];return f.length>2&&near.includes(f)})}
  if(idx<0){idx=P.findIndex(p=>p.tu&&m.who.includes(p.tu.split(/[\s\/]+/)[0]))}
  out.push({who:m.who,lat:loc.lat,lng:loc.lng,idx})});
 return out}

const GC=['#1F6B57','#D9A21B','#B3402F','#2F5DA8','#7A4FA0','#3E8E41','#C2185B','#6D4C41','#00838F','#9E9D24'];
function drawMap(){const c=$('#mp'),P=pupils().map((p,i)=>({...p,i})).filter(p=>p.lat!=null);const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.width*0.75*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);const W=r.width,H=W*.75;
 const la=P.map(p=>p.lat),ln=P.map(p=>p.lng);let a=Math.min(...la),b=Math.max(...la),e=Math.min(...ln),f=Math.max(...ln);const k=Math.cos(a*Math.PI/180);let sx=(f-e)*k||.002,sy=(b-a)||.002;const s=Math.min((W-40)/sx,(H-40)/sy);
 const css=getComputedStyle(document.documentElement);x.fillStyle=css.getPropertyValue('--surface');x.fillRect(0,0,W,H);x.font='bold 11px sans-serif';x.textAlign='center';
 P.forEach(p=>{const px=W/2+((p.lng-(e+f)/2)*k)*s,py=H/2-(p.lat-(a+b)/2)*s;x.fillStyle=p.grp?GC[(p.grp-1)%GC.length]:'#888';x.beginPath();x.arc(px,py,9,0,7);x.fill();x.fillStyle='#fff';x.fillText(p.i+1,px,py+4)})}
function autoGroups(){const P=pupils(),pts=P.map((p,i)=>({p,i})).filter(o=>o.p.lat!=null);const g=grp(clsSize()).g,k=Math.max(1,Math.round(pts.length/g));
 const k0=Math.cos((pts[0].p.lat)*Math.PI/180),xy=o=>[o.p.lng*k0,o.p.lat];let C=[xy(pts[0])];
 while(C.length<k){let best=null,bd=-1;pts.forEach(o=>{const q=xy(o),dd=Math.min(...C.map(c=>(c[0]-q[0])**2+(c[1]-q[1])**2));if(dd>bd){bd=dd;best=q}});C.push(best)}
 const cap=Math.ceil(pts.length/k);let as=[];
 for(let it=0;it<15;it++){const cnt=Array(k).fill(0);as=[];const order=pts.map(o=>{const q=xy(o);const ds=C.map(c=>(c[0]-q[0])**2+(c[1]-q[1])**2);return{o,ds,m:Math.min(...ds)}}).sort((u,v)=>u.m-v.m);
  order.forEach(({o,ds})=>{const idx=ds.map((v,j)=>[v,j]).sort((u,v)=>u[0]-v[0]).map(z=>z[1]).find(j=>cnt[j]<cap);cnt[idx]++;as.push([o,idx])});
  C=C.map((c,j)=>{const m=as.filter(z=>z[1]==j).map(z=>xy(z[0]));return m.length?[m.reduce((s,q)=>s+q[0],0)/m.length,m.reduce((s,q)=>s+q[1],0)/m.length]:c})}
 as.forEach(([o,j])=>P[o.i].grp=j+1);save();return k}

async function gz(txt){try{const cs=new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'));const u=new Uint8Array(await new Response(cs).arrayBuffer());let b='';u.forEach(x=>b+=String.fromCharCode(x));return 'RAFIQ2:'+btoa(b)}catch(e){return 'RAFIQ2T:'+btoa(unescape(encodeURIComponent(txt)))}}
async function ungz(t){const m=t.match(/RAFIQ2T?:[A-Za-z0-9+\/=\s]+/);if(!m)throw new Error('none');const c=m[0].replace(/\s+/g,'');
 if(c.startsWith('RAFIQ2T:'))return JSON.parse(decodeURIComponent(escape(atob(c.slice(8)))));
 const bin=atob(c.slice(7)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
 return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
async function mkPk(t,to,d){const p=S.prof||{};return gz(JSON.stringify({v:2,t,to,at:Date.now(),f:{r:ROLE||'mou',id:myId(),n:p.name||'',s:p.school||'',c:isT()?S.cls:null,ph:p.phone||'',cl:isT()?myCls():null},d}))}

const KMAP={lecture:['القراءة'],ecriture:['الإملاء والخط','الكتابة'],expression:['التعبير'],nahw:['النحو والصرف'],imla:['الإملاء'],calcul:['الحساب'],geom:['الهندسة'],mesure:['القياس']};
async function weekPlan(w){clearT();const c=S.cls,P=await loadProg(c);w=w||wkOf(c);const T=ttOf(c),D=doneP(c);
 const L2=(P||[]).filter(l=>l.w==w);const used=new Set(),plan={1:[],2:[],3:[],4:[],5:[]};
 for(let d=1;d<=5;d++)T[d].forEach(x=>{const l=L2.find(l=>!used.has(l.i)&&(KMAP[l.k]||[]).some(n=>x[2].includes(n)));if(l){used.add(l.i);plan[d].push({x,l})}});
 const rest=L2.filter(l=>!used.has(l.i));
 const li=l=>`<label class="row pr wp6"><input type="checkbox" data-l="${l.i}" ${D[l.i]?'checked':''}><div class="t"><b>${H(l.t)}</b><div class="sub">${SNM(l.s)} · ${KL[l.k]||''}${l.pg?' · ص '+l.pg:''}</div></div></label>`;

 ${L2.length?[1,2,3,4,5].map(d=>plan[d].length?`<h2 class="sec">${DAYS[d]}</h2><div class="list">${plan[d].map(({x,l})=>`<div class="slot6">${t12(x[0])}</div>${li(l)}`).join('')}</div>`:'').join('')+(rest.length?`<h2 class="sec">دروس أخرى هذا الأسبوع</h2><div class="list">${rest.map(li).join('')}</div>`:'')
 :`<div class="card"><p class="ar">${SPECIALW[w]?'أسبوع خاص: '+SPECIALW[w]+'.':'لا توجد دروس مسجلة لهذا الأسبوع في البرنامج.'}</p></div>`}
 <button class="btn ghost" id="sd" style="width:100%">📤 أرسل برمجة الأسبوع إلى المدير</button>`;
 $('#bk').onclick=clsHub;$('#pw').onclick=()=>weekPlan(Math.max(1,w-1));$('#nw').onclick=()=>weekPlan(Math.min(38,w+1));
 app.querySelectorAll('[data-l]').forEach(b=>b.onchange=()=>{const l=P[+b.dataset.l];if(b.checked){D[l.i]=Date.now();S.log.push({c,d:todayStr(),s:l.s,t:l.t,st:'أنجز كاملا',n:''})}else{delete D[l.i];const k=S.log.findIndex(e=>e.c==c&&e.t==l.t);if(k>=0)S.log.splice(k,1)}save()});

  send('plan','mud',d,`🗓 برمجة الأسبوع ${w} · ${CLS[c]} · ${SCH[S.prof.school]||''}\nالمعلم: ${S.prof.name||''}\n`+[1,2,3,4,5].map(k=>days[k].length?`\n${DAYS[k]}:\n`+days[k].map(y=>`• ${t12(y[0])}: ${y[1]}`).join('\n'):'').join('')+`\n\nأنجز ${d.done} من ${d.tot}`,(S.ct&&S.ct.mud&&S.ct.mud.ph)||'',()=>weekPlan(w))};scrollTo(0,0)}

/* ================= v7 — التدرج المتكيف، يومي، الواجب التابع للتقدم، دعم الأم المرجع ================= */
const HOLW=w=>/عطلة/.test(SPECIALW[w]||'');
const weekOfDate=d=>Math.max(1,Math.min(38,Math.floor((new Date(d+'T12:00')-START)/(7*864e5))+1));
const partOf=c=>{S.part=S.part||{};return S.part[c]=S.part[c]||{}};
const kindOfSlot=lab=>Object.keys(KMAP).find(k=>KMAP[k].some(n=>lab.includes(n)));
/* file d'attente par type de séance: leçons non faites dans l'ordre du programme (les partielles d'abord) */
async function queues(c){const P=await loadProg(c);if(!P)return{};const D=doneP(c),Pa=partOf(c),Q={};
 P.filter(l=>!D[l.i]).sort((a,b)=>(Pa[b.i]?1:0)-(Pa[a.i]?1:0)||a.w-b.w||a.i-b.i).forEach(l=>(Q[l.k]=Q[l.k]||[]).push(l));return Q}
/* le plan glissant: à partir d'aujourd'hui, chaque séance reçoit la prochaine leçon non faite de son type */
async function rollPlan(c,n){n=n||10;const Q=await queues(c),T=ttOf(c),out=[];let d=todayStr(),k=0,guard=0;
 const q={};for(const x in Q)q[x]=Q[x].slice();
 while(out.length<n&&guard++<60){const wd=new Date(d+'T12:00').getDay(),w=weekOfDate(d);
  if(wd>=1&&wd<=5){if(HOLW(w))out.push({d,w,hol:SPECIALW[w],s:[]});else{const s=(T[wd]||[]).map(x=>{const kk=kindOfSlot(x[2]);const l=kk&&q[kk]&&q[kk].length?q[kk].shift():null;return{x,l}});out.push({d,w,s})}}
  d=addD(d,1)}return out}
/* retard par matière: leçons du programme dont la semaine est passée et qui ne sont pas faites */
async function delays(c){const P=await loadProg(c);if(!P)return{};const D=doneP(c),cw=wkOf(c),R={};
 ['ar','ma'].forEach(s=>{const A=P.filter(l=>l.s==s);if(!A.length)return;const perW=A.length/Math.max(1,new Set(A.map(l=>l.w)).size);
  const late=A.filter(l=>l.w<cw&&!D[l.i]).length,ahead=A.filter(l=>l.w>cw&&D[l.i]).length;R[s]={late,ahead,weeks:Math.round(late/perW*10)/10,perW}});return R}
const dLabel=v=>v.late?(v.weeks>=3?`متأخر ${v.weeks.toString().replace('.',',')} أسابيع: خطة استدراك مكتوبة يتابعها المدير والمفتش`:v.weeks>=2?`متأخر ${v.weeks.toString().replace('.',',')} أسبوع: يلزم استدراك`:`متأخر ${nLate(v.late)}: يُستدرك خلال الأسبوع`):v.ahead?`متقدم بـ ${nLate(v.ahead)}`:'في الموعد';
const nLate=n=>n==1?'درس واحد':n==2?'درسين':n<=10?n+' دروس':n+' درسا';

(function(){var Z=[1,1.12,1.25,1.4],k=0;try{k=+localStorage.getItem('rafiq_zoom')||0}catch(e){}
 function ap(){document.documentElement.style.zoom=Z[k];try{localStorage.setItem('rafiq_zoom',k)}catch(e){}}

 function ask(w){if(document.getElementById('rq-upd'))return;var b=document.createElement('button');b.id='rq-upd';b.textContent='🔄 نسخة جديدة من رفيق جاهزة — اضغط للتحديث';b.onclick=function(){b.disabled=true;w.postMessage('skip')};document.body.appendChild(b)}

 setInterval(function(){reg.update().catch(function(){})},3600000)}).catch(function(){})}
